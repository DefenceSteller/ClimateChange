{% extends './template.html' %}
{% load static %}
{% block body %}

<!-- Content Wrapper Start -->
<div class="content-wrapper">

    <!-- Breadcrumb Start -->
    <div class="breadcrumb-wrap bg-f br-1">
        <div class="container">
            <div class="breadcrumb-title">
                <h2>Signup</h2>
                <ul class="breadcrumb-menu list-style">
                    <li><a href="index.html">Home </a></li>
                    <li>Signup</li>
                </ul>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <!-- Account Section start -->
    <section class="Login-wrap pt-100 pb-75">
        <div class="container">
            <div class="row gx-5">
                <div class="col-xl-6 offset-xl-3 col-lg-8 offset-lg-2">
                    <div class="login-form-wrap">
                        <div class="login-header">
                            <h3>Create Account</h3>
                        </div>

                        <!-- Display Error Message if any -->
                        {% if error %}
                            <div class="alert alert-danger" style="color: red; margin-bottom: 15px;">
                                {{ error }}
                            </div>
                        {% endif %}

                        <form class="login-form" method="POST">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="full_name" name="full_name" type="text" placeholder="Full Name" required>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="username" name="username" type="text" placeholder="Username" required>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="email" name="email" type="email" placeholder="Email Address" required>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="pwd" name="pwd" placeholder="Password" type="password" required>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="pwd_2" name="pwd_2" placeholder="Confirm Password" type="password" required>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <input id="address" name="address" type="text" placeholder="Street Address">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input id="city" name="city" type="text" placeholder="City">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input id="state" name="state" type="text" placeholder="State">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input id="country" name="country" type="text" placeholder="Country">
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <input id="zip_code" name="zip_code" type="text" placeholder="Zip Code">
                                    </div>
                                </div>
                                <div class="col-sm-12 col-12 mb-20">
                                    <div class="checkbox style3">
                                        <input type="checkbox" id="test_1" required>
                                        <label for="test_1">
                                            I Agree with the <a class="link style1" href="terms-of-service.html">Terms &amp; conditions</a>
                                        </label>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <button type="submit" class="btn style1 w-100 d-block">
                                            Signup 
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <p class="mb-0">Have an Account? <a class="link style1" href="login.html">Sign In</a></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Account Section end -->

</div>
<!-- Content wrapper end -->

{% endblock %}
